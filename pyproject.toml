[project]
name = "email-parser"
version = "0.1.0"
description = "Restaurant lead parser: Google Maps -> websites & socials -> e-mail addresses"
requires-python = ">=3.10"
dependencies = [
    "httpx[http2]>=0.27,<1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "playwright>=1.45",
    "tldextract>=5.1",
    "python-dotenv>=1.0",
    "dnspython>=2.6",
    "openpyxl>=3.1",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
email-parser = "email_parser.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["email_parser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
